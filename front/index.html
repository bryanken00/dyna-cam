<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CR-036: the DGPlay logo's icons (scripts/brand-icons.mjs) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#174F8A" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="DGSports — court booking and replay cameras for pickleball venues."
    />
    <meta name="theme-color" content="#F4F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B2333" media="(prefers-color-scheme: dark)" />
    <title>DGSports</title>
    <!-- Fonts are self-hosted via @fontsource-variable (imported in main.jsx).
         No Google Fonts <link> here: it double-loaded the same families and made
         every production page hit an external origin. -->
    <!-- Apply the saved theme (or the OS one on "auto") before paint to avoid a
         flash of the wrong mode. Mirrors src/store/themeStore.js. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(
            localStorage.getItem("%VITE_STORE_KEY%-ui-theme") || "null",
          );
          // v0 saves predate "auto"; the store resets them to auto, so match that.
          var mode = saved && saved.version >= 1 ? saved.state.mode : "auto";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <!-- CR-036: the opening splash (src/components/splash/startSplash.js): the
         DGPlay logo bounces in on its blue, once per browser tab. Drawn here so
         it's up from the first paint; once this tab has seen it, it's hidden
         before paint and startSplash removes it. -->
    <style>
      #dg-splash {
        position: fixed; inset: 0; z-index: 2147483647;
        display: grid; place-items: center;
        background: linear-gradient(170deg, #174F8A 0%, #4189C8 100%);
        transition: opacity 320ms ease-out, transform 320ms ease-out;
      }
      #dg-splash img {
        width: min(52vw, 300px); height: auto;
        animation: dg-bounce-in 1100ms cubic-bezier(0.2, 0.8, 0.3, 1) both;
      }
      #dg-splash.dg-out { opacity: 0; transform: scale(1.06); pointer-events: none; }
      @keyframes dg-bounce-in {
        0% { opacity: 0; transform: translateY(36px) scale(0.35); }
        55% { opacity: 1; transform: translateY(0) scale(1.08); }
        75% { transform: scale(0.96); }
        100% { transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #dg-splash img { animation: none; }
        #dg-splash { transition: none; }
      }
      html.dg-splash-seen #dg-splash { display: none; }
    </style>
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("dg-splash-seen") === "1")
            document.documentElement.classList.add("dg-splash-seen");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="dg-splash" aria-hidden="true"><img src="/brand/logo-on-blue.svg" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
