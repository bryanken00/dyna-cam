<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CR-036: the DGPlay logo's icons (scripts/brand-icons.mjs) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#174F8A" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="DGSports — find a pickleball court near you, book it and pay online."
    />
    <meta name="theme-color" content="#F4F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B2333" media="(prefers-color-scheme: dark)" />
    <title>DGSports</title>
    <!-- Fonts are self-hosted via @fontsource-variable (imported in main.jsx).
         No Google Fonts <link> here: it double-loaded the same families and made
         every production page hit an external origin. -->
    <!-- Apply the saved theme (or the OS one on "auto") before paint to avoid a
         flash of the wrong mode. Mirrors src/store/themeStore.js. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(
            localStorage.getItem("%VITE_STORE_KEY%-ui-theme") || "null",
          );
          // v0 saves predate "auto"; the store resets them to auto, so match that.
          var mode = saved && saved.version >= 1 ? saved.state.mode : "auto";
          var dark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
